plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"

# Classes are documented with a short "why" comment only where it helps;
# a mandatory comment on every class adds noise to small, obvious ones.
Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

# A request spec checks one response: its status, headers and body.
# Splitting that into one example per line would repeat the request each time.
RSpec/MultipleExpectations:
  Max: 5

# Specs under spec/db test the schema and the seeds, which are not classes.
RSpec/DescribeClass:
  Exclude:
    - "spec/db/**/*"

# A multi-line expected hash is one assertion, not several lines of logic.
RSpec/ExampleLength:
  CountAsOne: ["array", "hash", "heredoc", "method_call"]
