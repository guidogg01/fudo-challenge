plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"

# Las clases llevan un comentario de "por qué" solo donde suma;
# exigirlo en cada clase agrega ruido en las chicas y obvias.
Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

# Un spec de request verifica una respuesta: status, headers y body.
# Separarlo en un ejemplo por línea repetiría el request cada vez.
RSpec/MultipleExpectations:
  Max: 5

# Los specs de spec/db y el de dependencias prueban el esquema, el seed y el Gemfile.lock, que no son clases.
RSpec/DescribeClass:
  Exclude:
    - "spec/db/**/*"
    - "spec/dependencies_spec.rb"

# Un hash esperado de varias líneas es una sola aserción, no varias líneas de lógica.
# Los ejemplos de punta a punta (request, después job, después consulta) necesitan unas líneas más.
RSpec/ExampleLength:
  Max: 8
  CountAsOne: ["array", "hash", "heredoc", "method_call"]
