name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The same PostgreSQL and Redis versions as docker-compose.yml.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: fudo
          POSTGRES_PASSWORD: fudo
          POSTGRES_DB: fudo-challenge-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fudo -d fudo-challenge-test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.8.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      RACK_ENV: test
      TEST_DATABASE_URL: postgres://fudo:fudo@localhost:5432/fudo-challenge-test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop

      # spec/spec_helper.rb migrates the test database before the suite runs.
      - name: RSpec
        run: bundle exec rspec
