name: CI

on:
  # Solo main en push: en un PR el evento pull_request ya lo corre, y si no correría dos veces.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: fudo
          POSTGRES_PASSWORD: fudo
          POSTGRES_DB: fudo-challenge-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fudo -d fudo-challenge-test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.8.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      RACK_ENV: test
      TEST_DATABASE_URL: postgres://fudo:fudo@localhost:5432/fudo-challenge-test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop

      # spec/spec_helper.rb migra la base de test antes de correr la suite.
      - name: RSpec
        run: bundle exec rspec

  # Prueba de punta a punta: el mismo stack que en local (app, worker, PostgreSQL y Redis)
  # con la colección de Postman corrida por Newman.
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start the stack
        run: docker compose up --build --detach --wait app worker

      - name: Seed the demo user
        run: docker compose exec -T app bundle exec rake db:seed

      - name: Run the Postman collection
        run: >-
          npx --yes newman@6.2.2 run postman/fudo-challenge.postman_collection.json
          --environment postman/local.postman_environment.json

      - name: Show the logs
        if: failure()
        run: docker compose logs app worker
