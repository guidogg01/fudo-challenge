name: fudo-challenge

x-ruby-service: &ruby-service
  build: .
  environment:
    RACK_ENV: ${RACK_ENV:-development}
    PORT: ${PORT:-9292}
    PUMA_MAX_THREADS: ${PUMA_MAX_THREADS:-5}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    DATABASE_URL: ${DATABASE_URL:-postgres://fudo:fudo@db:5432/fudo-challenge}
    TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgres://fudo:fudo@db:5432/fudo-challenge-test}
    BCRYPT_COST: ${BCRYPT_COST:-12}
    TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-86400}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  # Mounting the code lets tests and RuboCop run on the latest edits
  # without rebuilding the image.
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *ruby-service
    # Brings the schema up to date before serving, so a fresh clone works
    # with a plain "docker compose up". Seeding stays a manual step.
    command: ["sh", "-c", "bundle exec rake db:migrate && exec bundle exec puma -C config/puma.rb"]
    ports:
      - "9292:9292"
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit Net::HTTP.get_response(URI('http://localhost:9292/health')).is_a?(Net::HTTPSuccess)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *ruby-service
    command: ["bundle", "exec", "sidekiq", "-r", "./config/boot.rb"]
    # The worker loads the models, so it also waits until the app has migrated
    # the schema. This list replaces the shared one, so it repeats db and redis.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: fudo
      POSTGRES_PASSWORD: fudo
      POSTGRES_DB: fudo-challenge
    ports:
      # 5433 on the host so it does not clash with a local PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
      # Creates the test database the first time the volume is initialized.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fudo", "-d", "fudo-challenge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.3-alpine
    # appendonly persists every write to disk, so scheduled jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.33.3
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
      FILTER: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./docs:/docs:ro

volumes:
  db-data:
  redis-data:
