name: fudo-challenge

x-ruby-service: &ruby-service
  build: .
  environment:
    RACK_ENV: ${RACK_ENV:-development}
    PORT: ${PORT:-9292}
    PUMA_MAX_THREADS: ${PUMA_MAX_THREADS:-5}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    DATABASE_URL: ${DATABASE_URL:-postgres://fudo:fudo@db:5432/fudo-challenge}
    TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgres://fudo:fudo@db:5432/fudo-challenge-test}
    BCRYPT_COST: ${BCRYPT_COST:-12}
    TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-86400}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  # Montar el código permite correr los tests y RuboCop sobre los últimos cambios
  # sin reconstruir la imagen.
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *ruby-service
    # Pone el esquema al día antes de atender, así un clon nuevo anda
    # con un simple "docker compose up". El seed sigue siendo un paso manual.
    command: ["sh", "-c", "bundle exec rake db:migrate && exec bundle exec puma -C config/puma.rb"]
    ports:
      - "9292:9292"
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit Net::HTTP.get_response(URI('http://localhost:9292/health')).is_a?(Net::HTTPSuccess)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *ruby-service
    command: ["bundle", "exec", "sidekiq", "-r", "./config/boot.rb"]
    # El worker carga los modelos, así que también espera a que la app haya migrado
    # el esquema. Esta lista reemplaza la compartida, por eso repite db y redis.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: fudo
      POSTGRES_PASSWORD: fudo
      POSTGRES_DB: fudo-challenge
    ports:
      # 5433 en el host para no chocar con un PostgreSQL local en el 5432.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
      # Crea la base de test la primera vez que se inicializa el volumen.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fudo", "-d", "fudo-challenge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.3-alpine
    # appendonly guarda cada escritura en disco, así los jobs programados sobreviven a un reinicio.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.33.3
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
      FILTER: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./docs:/docs:ro

volumes:
  db-data:
  redis-data:
